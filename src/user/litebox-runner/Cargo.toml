[package]
name = "litebox-runner"
version.workspace = true
license-file.workspace = true
edition.workspace = true
authors.workspace = true
description = "Runner for LiteBox"
homepage.workspace = true

[[bin]]
name = "litebox-runner"

[dependencies]
posix = { workspace = true, features = ["syscall", "allocator", "kcall"] }
litebox = { path = "/home/ppenna/src/nanvix/litebox/litebox", default-features = false }
litebox_shim_linux = { path = "/home/ppenna/src/nanvix/litebox/litebox_shim_linux", default-features = false }
litebox_platform_multiplex = { path = "/home/ppenna/src/nanvix/litebox/litebox_platform_multiplex", default-features = false, features = [
    "platform_nanvix_userland",
] }
litebox-nanvix = { path = "../../libs/litebox-nanvix", default-features = false }

[build-dependencies]
cc = { workspace = true }
cfg-if = { workspace = true }

[features]
default = ["panic"]
trace = ["posix/trace"]
debug = ["posix/debug"]
info = ["posix/info"]
warn = ["posix/warn"]
error = ["posix/error"]
panic = ["posix/panic"]
