[package]
name = "microvm"
version.workspace = true
license-file.workspace = true
edition = "2024"
authors.workspace = true
homepage.workspace = true

[lib]
name = "microvm"
path = "src/lib.rs"

[[bin]]
name = "microvm"
path = "src/main.rs"

[dependencies]
arch = { workspace = true }
anyhow = { workspace = true }
flexi_logger = { workspace = true }
log = { workspace = true }
profiler = { workspace = true, features = ["auto-calibrate"] }
sys = { workspace = true }
syscall = { workspace = true }
cfg-if = { workspace = true }
config = { workspace = true, features = ["microvm"] }
syscomm = { workspace = true }
hyperlight-common = { workspace = true }
hyperlight-guest = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
hyperlight-host = { git = "https://github.com/danbugs/hyperlight", rev = "27c01ea", default-features = false, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
hyperlight-host = { git = "https://github.com/danbugs/hyperlight", rev = "27c01ea", default-features = false, optional = true, features = ["kvm"] }
kvm-bindings = { workspace = true }
kvm-ioctls = { workspace = true }
libc = { workspace = true }

[features]
default = []
hyperlight = ["dep:hyperlight-host", "config/hyperlight"]
profiler = ["profiler/auto-calibrate"]
auto-calibrate = []
timestamp-messages = ["profiler/timestamp-messages"]
